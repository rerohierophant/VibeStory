plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.vibestory'
version = '0.7.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.10.0'
    implementation 'org.jcodec:jcodec-javase:0.2.5'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach { options.compilerArgs += '-parameters' }
tasks.named('test') {
    useJUnitPlatform { excludeTags "rabbit" }
    jvmArgs '-Djava.awt.headless=true'
    testLogging { events 'failed', 'skipped'; exceptionFormat 'full' }
}
tasks.named('bootJar') { archiveFileName = 'vibestory-api.jar' }

// Real broker protocol tests are explicit; the database-only regression never silently skips them.
tasks.register('rabbitTest', Test) {
    outputs.upToDateWhen { false }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'rabbit' }
    jvmArgs '-Djava.awt.headless=true'
    testLogging { events 'failed', 'skipped'; exceptionFormat 'full' }
}

tasks.withType(Test).configureEach {
    systemProperty 'vibestory.contracts-dir', rootProject.file('packages/contracts').absolutePath
}
