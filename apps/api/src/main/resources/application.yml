spring:
  application:
    name: vibestory-api
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vibestory}
    username: ${DATABASE_USER:vibestory}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 3s
    template:
      mandatory: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USER:}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms
      connect-timeout: 500ms
      repositories:
        enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jooq:
    sql-dialect: POSTGRES
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
vibestory:
  mock-only: ${MOCK_ONLY:false}
  seed:
    email: ${SEED_EMAIL:}
    password: ${SEED_PASSWORD:}
  admission:
    enabled: ${ADMISSION_ENABLED:false}
    namespace: ${ADMISSION_NAMESPACE:vibestory}
    text-credential-id: ${TEXT_CREDENTIAL_ID:shared-text}
    media-credential-id: ${MEDIA_CREDENTIAL_ID:shared-media}
    text-rate: ${TEXT_SUBMIT_RATE:1}
    text-burst: ${TEXT_SUBMIT_BURST:2}
    media-rate: ${MEDIA_SUBMIT_RATE:1}
    media-burst: ${MEDIA_SUBMIT_BURST:2}
    permit-ttl: ${ADMISSION_PERMIT_TTL:2s}
    error-backoff: ${ADMISSION_ERROR_BACKOFF:1s}
    ttl-margin: ${ADMISSION_TTL_MARGIN:60s}
  dispatch:
    mode: ${DISPATCH_MODE:database}
    role: ${APP_ROLE:all}
    namespace: ${MQ_NAMESPACE:vibestory}
    relay-enabled: ${RELAY_ENABLED:true}
    prefetch: ${MQ_PREFETCH:2}
    text-slots: ${TEXT_SLOTS:1}
    image-slots: ${IMAGE_SLOTS:2}
    video-slots: ${VIDEO_SLOTS:2}
    max-failures: 5
    confirm-timeout: 5s
    relay-lease: 15s
    redelivery-after: 30s
  worker:
    enabled: ${WORKER_ENABLED:true}
    concurrency: 2
    poll-interval: 500ms
    lease-duration: 90s
    heartbeat-interval: 30s
    max-attempts: 3
  mock:
    delay: ${MOCK_DELAY:3s}
    failure-rate: ${MOCK_FAILURE_RATE:0}
    failure-mode: ${MOCK_FAILURE_MODE:known}
  text:
    provider: ${TEXT_PROVIDER:mock}
    base-url: ${TEXT_BASE_URL:https://api.deepseek.com}
    model: ${TEXT_MODEL:deepseek-flash}
    api-key: ${TEXT_API_KEY:}
    timeout: ${TEXT_TIMEOUT:120s}
    max-tokens: ${TEXT_MAX_TOKENS:8192}
    disable-thinking: ${TEXT_DISABLE_THINKING:true}
  image:
    provider: ${IMAGE_PROVIDER:mock}
    base-url: ${IMAGE_BASE_URL:https://api.minimax.cn/v1}
    model: ${IMAGE_MODEL:image-01}
    api-key: ${IMAGE_API_KEY:}
    timeout: ${IMAGE_TIMEOUT:120s}
  video:
    provider: ${VIDEO_PROVIDER:mock}
    base-url: ${VIDEO_BASE_URL:https://api.minimax.cn/v1}
    model: ${VIDEO_MODEL:MiniMax-Hailuo-2.3-Fast}
    api-key: ${VIDEO_API_KEY:${IMAGE_API_KEY:}}
    timeout: ${VIDEO_TIMEOUT:60s}
    poll-interval: ${VIDEO_POLL_INTERVAL:5s}
    generation-timeout: ${VIDEO_GENERATION_TIMEOUT:20m}
  storage:
    root: ${STORAGE_ROOT:./data/storage}
  skills:
    root: ${SKILLS_ROOT:./skills}
  agent-context:
    enabled: ${AGENT_CONTEXT_ENABLED:true}
    tool-result-bytes: ${AGENT_CONTEXT_TOOL_RESULT_BYTES:16384}
    tool-batch-bytes: ${AGENT_CONTEXT_TOOL_BATCH_BYTES:65536}
    preview-bytes: ${AGENT_CONTEXT_PREVIEW_BYTES:1536}
    trigger-bytes: ${AGENT_CONTEXT_TRIGGER_BYTES:262144}
    target-bytes: ${AGENT_CONTEXT_TARGET_BYTES:196608}
    keep-recent-results: ${AGENT_CONTEXT_KEEP_RECENT_RESULTS:3}
    keep-recent-groups: ${AGENT_CONTEXT_KEEP_RECENT_GROUPS:2}
    summary-input-bytes: ${AGENT_CONTEXT_SUMMARY_INPUT_BYTES:65536}
    summary-output-bytes: ${AGENT_CONTEXT_SUMMARY_OUTPUT_BYTES:8192}
    max-summary-calls: ${AGENT_CONTEXT_MAX_SUMMARY_CALLS:32}
logging:
  structured:
    format:
      console: logstash
  level:
    org.jooq.Constants: WARN
